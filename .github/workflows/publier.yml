name: Publication Instagram du jour
on:
  schedule:
    # Un essai toutes les 30 min de 10 h 27 à 19 h 57 UTC : GitHub saute parfois des créneaux.
    # Le script ne publie rien avant 12 h 25 (heure de Paris) et un seul post par jour.
    - cron: '27,57 10-19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publication
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Jeton
        run: node jeton.mjs
        env:
          IG_TOKEN_INIT: ${{ secrets.IG_TOKEN_INIT }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      - name: Publier
        run: node publier.mjs
        env:
          FORCER: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "Robot Instagram Meujesse"
          git config user.email "contact@meujesselearning.com"
          git add calendrier.json jeton.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publication du $(date +%F)" && git push)
