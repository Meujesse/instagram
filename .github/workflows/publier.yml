name: Publication Instagram du jour
on:
  schedule:
    # Plusieurs essais par jour : GitHub ne garantit pas l'heure, le script ne publie qu'un post par jour.
    - cron: '30 10 * * *'
    - cron: '10 11 * * *'
    - cron: '50 11 * * *'
    - cron: '40 13 * * *'
    - cron: '20 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publication
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Jeton
        run: node jeton.mjs
        env:
          IG_TOKEN_INIT: ${{ secrets.IG_TOKEN_INIT }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      - name: Publier
        run: node publier.mjs
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "Robot Instagram Meujesse"
          git config user.email "contact@meujesselearning.com"
          git add calendrier.json jeton.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publication du $(date +%F)" && git push)
