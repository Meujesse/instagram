<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meujesse Learning · Liens</title>
<meta name="description" content="Les liens des publications Instagram de Meujesse Learning">
<style>
@font-face{font-family:PTN;src:url(fonts/titre.woff2) format('woff2');font-weight:800;font-style:italic}
:root{--bg:#fff;--fg:#230000;--mut:#6b4a4a;--card:#fff;--line:#f0dfe4}
@media (prefers-color-scheme:dark){:root{--bg:#1a0b10;--fg:#fbf3f5;--mut:#d8bfc6;--card:#26131a;--line:#3d2129}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Avenir Next',Avenir,Nunito,system-ui,sans-serif}
header{background:linear-gradient(180deg,#e60064,#e4003b);color:#fff;text-align:center;padding:28px 16px 32px}
header img{height:110px}header h1{font-family:PTN,Georgia,serif;font-style:italic;font-weight:800;font-size:28px;margin:6px 0 4px;letter-spacing:.02em}
header p{margin:0;opacity:.92}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h2{font-family:PTN,Georgia,serif;font-style:italic;font-weight:800;color:#e4003a;font-size:22px;margin:28px 0 12px}
@media (prefers-color-scheme:dark){h2{color:#ff4d7a}}
.btn{display:block;text-align:center;background:#e4003a;color:#fff;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:26px;margin:10px 0}
.btn:hover{background:#e60064}.btn.sec{background:transparent;color:#522583;border:2px solid #522583}
@media (prefers-color-scheme:dark){.btn.sec{color:#cdb4ff;border-color:#cdb4ff}}
.post{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;text-decoration:none;color:inherit;box-shadow:0 4px 18px rgba(82,37,131,.08)}
.post img{width:72px;height:90px;object-fit:cover;border-radius:8px;flex:none}
.post b{display:block;font-size:15px;line-height:1.3}.post span{font-size:13px;color:var(--mut)}
.vide{color:var(--mut)}
</style></head><body>
<header><img src="logo-blanc.svg" alt="Meujesse Learning"><h1>Les liens de nos posts</h1><p>Le dernier post publié est en haut de la liste.</p></header>
<main>
<div id="posts"><p class="vide">Chargement…</p></div>
<h2>Toujours utiles</h2>
<a class="btn" href="https://portfolio.meujesselearning.com">Testez nos modules</a>
<a class="btn sec" href="https://calendly.com/jyn-chereze/decouverte">Réserver un appel découverte</a>
<a class="btn sec" href="https://www.youtube.com/@meujesselearning">Notre chaîne YouTube</a>
<a class="btn sec" href="https://meujesselearning.com">Le site de l'agence</a>
</main>
<script>
fetch('calendrier.json',{cache:'no-store'}).then(r=>r.json()).then(cal=>{
  const pub=cal.filter(p=>p.publie&&p.lien).sort((a,b)=>b.publie.le.localeCompare(a.publie.le)).slice(0,30);
  const el=document.getElementById('posts');
  if(!pub.length){el.innerHTML='<p class="vide">Les liens apparaîtront ici au fil des publications.</p>';return;}
  el.innerHTML='';
  for(const p of pub){
    const a=document.createElement('a');a.className='post';a.href=p.lien;
    const img=(p.images&&p.images[0])||p.cover_url||'logo-blanc.svg';
    const d=new Date(p.publie.le).toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
    a.innerHTML=`<img alt="" src="${img}"><div><b></b><span>Publié le ${d}</span></div>`;
    a.querySelector('b').textContent=p.titre.replace(/\n/g,' ');
    el.appendChild(a);
  }
}).catch(()=>{document.getElementById('posts').innerHTML='<p class="vide">Liste indisponible pour le moment.</p>'});
</script>
</body></html>
